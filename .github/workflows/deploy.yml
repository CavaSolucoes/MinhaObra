name: Deploy CAVA+ (GitHub Pages)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores PÚBLICOS (ficam no bundle). Aceita Variables ou Secrets. NUNCA a service_role.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Verificar variáveis e que a chave é a pública (anon)
        run: node scripts/verify-public-key.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Conferir base path e assets (o dist publicado não pode ser o código-fonte)
        run: |
          grep -q 'src="/${{ github.event.repository.name }}/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
      - name: Nenhuma credencial privada no bundle
        run: "! grep -rIlE 'SUPABASE_SERVICE_ROLE_KEY|service_role[\"]?[ ]*:[ ]*[\"]?eyJ' dist"
      - name: SPA no GitHub Pages (404.html = index.html; assim /admin e /obra/TOKEN funcionam ao atualizar)
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
